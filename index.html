<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高校游戏社团宣传看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>高校游戏社团宣传看板</h1>
</header>

<div class="layout">
  <aside class="side">
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="search" type="search" placeholder="搜索社团或学校">
    </div>
    <ul id="clubList"></ul>
  </aside>

  <main id="main"></main>
</div>

<div id="lightbox" hidden>
  <button class="lb-btn lb-close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button class="lb-btn lb-prev" aria-label="上一张"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <figure>
    <img alt="">
    <figcaption></figcaption>
  </figure>
  <button class="lb-btn lb-next" aria-label="下一张"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
